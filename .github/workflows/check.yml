name: Check project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/project.py check
      - run: python tools/check_pilot.py
      - run: python tools/check_reader.py
      - run: python -m unittest discover -s tests -v
